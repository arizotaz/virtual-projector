services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_internal

  db-init:
    build:
      context: .
      dockerfile: ./db_init_dockerfile
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app_internal

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PROD: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ANONYMOUS_CLIENTS: ${ANONYMOUS_CLIENTS:-false}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "80:80"
    networks:
      - app_internal

volumes:
  mariadb_data:

networks:
  app_internal: