log_format detailed '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $request_uri $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

access_log /var/log/nginx/access.log detailed;
error_log  /var/log/nginx/error.log warn;

# websocket upgrade handling for socket.io
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _; # no specific domain name

    ssl_certificate     /etc/letsencrypt/live/app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /app/frontend;
    index index.html;

    client_max_body_size 5m;

    # REST API: /api/foo -> backend /foo (prefix is stripped by the trailing slash)
    location /api/ {
        client_max_body_size 15m;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # socket.io (client calls io() on the same origin, so it hits /socket.io/)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React app with client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # deny dotfiles
    location ~ /\. {
        deny all;
    }

    autoindex off;
}